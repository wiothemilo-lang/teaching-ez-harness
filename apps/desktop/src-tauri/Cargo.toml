[package]
name = "tez-desktop"
version = "0.1.0"
description = "tez desktop — local-first AI tutor"
edition = "2021"

[lib]
name = "tez_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
directories = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tez-auth = { path = "../../../crates/tez-auth" }
tez-core = { path = "../../../crates/tez-core" }
tez-llm = { path = "../../../crates/tez-llm" }
tez-store = { path = "../../../crates/tez-store" }
tez-update = { path = "../../../crates/tez-update" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

# Tauri app có target/ riêng, không build chung workspace root.
[workspace]
