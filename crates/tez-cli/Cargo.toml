[package]
name = "tez-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tez"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
dialoguer.workspace = true
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
tez-auth = { path = "../tez-auth" }
tez-core = { path = "../tez-core" }
tez-llm = { path = "../tez-llm" }
tez-store = { path = "../tez-store" }
tez-update = { path = "../tez-update" }
tokio.workspace = true

# Khôi phục SIGPIPE mặc định của Unix để `tez ... | head` không panic.
[target.'cfg(unix)'.dependencies]
libc.workspace = true
